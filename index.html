<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나는 어떤 눈으로 이야기를 보ㄹ까?</title>
<meta name="description" content="2주차 수업용 이야기 성향 테스트">
<style>
  :root{
    --paper:#FBFBFB;
    --box:#F0F0F0;
    --ink:#000000;
    --red:#D0000E;
    --mute:#555555;
    --line:#DCDCDC;
    --wrap:34rem;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;
    font-size:17px;
    line-height:1.62;
    -webkit-text-size-adjust:100%;
  }
  .shell{
    max-width:var(--wrap);
    margin:0 auto;
    padding:1.6rem 1.25rem 3rem;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }
  .masthead{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:.5rem;margin-bottom:1.6rem;
    font-size:.72rem;font-weight:700;letter-spacing:.06em;
  }
  .masthead .right{color:var(--mute);font-weight:600}

  /* ── 진행 눈금 ─────────────────────────── */
  .ticks{display:flex;gap:3px;margin-bottom:.55rem}
  .ticks i{flex:1;height:3px;background:var(--line);display:block}
  .ticks i.on{background:var(--ink)}
  .ticks i.now{background:var(--red)}
  .count{font-size:.75rem;color:var(--mute);margin-bottom:1.9rem;font-weight:600}

  h1{
    font-size:2.05rem;line-height:1.24;font-weight:800;
    letter-spacing:-.02em;margin:.2rem 0 .8rem;
  }
  .sub{color:var(--mute);font-size:.95rem;margin-bottom:2rem}

  /* ── 문항 ─────────────────────────────── */
  .setup{font-size:1.06rem;margin:0 0 1.15rem}
  .quotes{margin:0 0 1.3rem}
  .quotes p{
    background:var(--box);
    margin:0 0 .5rem;padding:.85rem 1rem;
    font-size:1rem;line-height:1.55;
  }
  .quotes p b{color:var(--red);margin-right:.5rem;font-weight:800}
  .ask{font-weight:800;font-size:1.1rem;margin:0 0 1.05rem}

  .opts{display:flex;flex-direction:column;gap:.6rem}
  button.opt{
    font:inherit;text-align:left;width:100%;
    background:var(--paper);color:var(--ink);
    border:1.5px solid var(--ink);
    padding:1rem 1.05rem;
    line-height:1.5;cursor:pointer;
  }
  button.opt:hover{background:var(--box)}
  button.opt[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button.opt:focus-visible{outline:3px solid var(--red);outline-offset:2px}

  /* ── 입력 ─────────────────────────────── */
  label.fld{display:block;font-weight:700;font-size:.95rem;margin-bottom:.5rem}
  input[type=text]{
    font:inherit;width:100%;padding:.9rem 1rem;
    border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:0;
  }
  input[type=text]:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .hint{font-size:.85rem;color:var(--mute);margin-top:.55rem}
  .warn{font-size:.85rem;color:var(--red);font-weight:700;margin-top:.55rem;display:none}
  .warn.show{display:block}

  /* ── 버튼 ─────────────────────────────── */
  .row{display:flex;gap:.6rem;margin-top:1.6rem;align-items:center}
  button.go{
    font:inherit;font-weight:800;cursor:pointer;
    background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);
    padding:.95rem 1.6rem;
  }
  button.go:hover{background:var(--red);border-color:var(--red)}
  button.back{
    font:inherit;font-weight:700;cursor:pointer;
    background:none;color:var(--mute);border:1.5px solid var(--line);
    padding:.95rem 1.25rem;
  }
  button.back:hover{color:var(--ink);border-color:var(--ink)}
  button.go:focus-visible,button.back:focus-visible{outline:3px solid var(--red);outline-offset:2px}

  /* ── 결과 ─────────────────────────────── */
  .card{border:1.5px solid var(--ink);padding:1.5rem 1.25rem;margin-bottom:1.4rem}
  .who{font-size:.78rem;font-weight:700;color:var(--red);letter-spacing:.05em;margin-bottom:.3rem}
  .name{font-size:1.5rem;font-weight:800;margin:0 0 1.1rem;word-break:break-all}
  .code{
    font-size:3.6rem;font-weight:800;letter-spacing:.06em;
    color:var(--red);line-height:1;margin:0 0 .55rem;
  }
  .tname{font-size:1.45rem;font-weight:800;margin:0 0 .15rem;line-height:1.3}
  .tsub{font-size:1rem;color:var(--mute);margin:0 0 1rem}
  .tdesc{font-size:1rem;margin:0}

  .axis{border-top:1px solid var(--line);padding:.85rem 0}
  .axis:first-of-type{border-top:none;padding-top:0}
  .axis .k{font-size:.78rem;font-weight:800;color:var(--red);letter-spacing:.04em}
  .axis .pick{font-size:1.02rem;font-weight:700;margin:.15rem 0 .2rem}
  .axis .near{font-size:.92rem;color:var(--mute);line-height:1.55}

  .closing{background:var(--box);padding:1.25rem;margin-bottom:1.4rem}
  .closing p{margin:0 0 .7rem;font-size:.97rem}
  .closing p:last-child{margin-bottom:0}
  .closing strong{font-weight:800}

  .shot{
    border:1.5px solid var(--red);padding:1rem 1.1rem;
    font-weight:800;font-size:1rem;color:var(--red);
  }
  .foot{margin-top:2.2rem;padding-top:.7rem;border-top:1px solid var(--line);
        font-size:.78rem;color:var(--mute)}
  .hidden{display:none}

  @media (max-width:400px){
    body{font-size:16px}
    h1{font-size:1.8rem}
    .code{font-size:3rem}
  }
  @media (prefers-reduced-motion:no-preference){
    .screen{animation:in .18s ease-out}
    @keyframes in{from{opacity:0}to{opacity:1}}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="masthead">
    <span>나는 어떤 눈으로 이야기를 볼까?</span>
    <span class="right">2주차</span>
  </div>
  <main id="stage"></main>
  <div class="foot">디지털 스토리텔링과 플랫폼 · 문화콘텐츠융합전공</div>
</div>

  NCSD:["행간형","말 안 해도 다 안다","설명해 주면 오히려 김이 샙니다. 스스로도 할 수 있으니까요. 이야기 사이 빈틈에서 읽어 내는 쪽이고, 그 빈틈을 제일 아낍니다."],
  NCSP:["설계형","어떻게 짜였는지가 보인다","보면서 구조가 보이는 사람입니다. 말로 설명해 주는 것보다 이야기의 짜임이 스스로 드러날 때 감탄해요."],

  JLVP:["본론형","그래서 무슨 일이 있었는데","중요한 일이 일어나야 하고, 그게 뭔지 분명히 전해져야 합니다. 사건끼리 꼭 이어질 필요는 없다고 보고요."],

  JCSD:["빈칸형","안 보여준 게 더 궁금하다","조건은 엄격한데 읽는 방식은 느슨합니다. 안 알려  줘도 알아채고, 오히려 비어 있는 자리에서 더 많이 읽어내요."],
  JCSP:["미니멀형","뺄 거 다 빼야 좋다","필요한 것만 남았을 때 가장 좋다고 느낍니다. 이유는 분명하고, 화면이 스스로 말하고, 쳐낼 건 쳐낸 상태요."]

const Q = [
  { axis:0,

  { axis:1,

    quotes:[],
    ask:"이 상황을 어떻게 생각하세요?",

  { axis:1,

            ["나","그는 회사를 그만뒀다. 그래서 제주도로 갔다."]],

          ["‘나’가 확실히 이야기다. ‘가’는 아직 뭔가 빠져 있다","C"]] },

  { axis:2,

    quotes:[],
    ask:"어떻게 생각하세요?",
    opts:[["그래도 괜찮다. 중요한 건 다 남으니까.","P"],
          ["그러면 다른 드라마가 된다. 덜어낸 자리에 있던 게 아까울 것 같다.","D"]] },

  { axis:3,
    setup:"10분짜리 요약 영상으로 드라마 한 시즌을 봤습니다.",
    quotes:[],
    ask:"보고 난 느낌은?",
    opts:[["볼만했다. 중요한 건 다 들어 있었다.","P"],
          ["뭔가 허전했다. 본 것 같지가 않았다.","D"]] }
];

/* ══════════ 상태 ══════════ */
let step = -1;                 // -1 = 이름 입력, 0..11 = 문항, 12 = 결과
let uname = "";
const picks = new Array(Q.length).fill(null);
const stage = document.getElementById("stage");

const esc = s => s.replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ══════════ 화면 ══════════ */
function render(){
  if (step === -1) return renderStart();
  if (step >= Q.length) return renderResult();
  renderQuestion();
}

function renderStart(){
  stage.innerHTML = `
    <div class="screen">
      <h1>나는 어떤 눈으로<br>이야기를 볼까?</h1>
      <p class="sub">정답은 없습니다. 어느 쪽이 더 자기 같은지만 고르면 됩니다.</p>
      <label class="fld" for="nm">이름을 적어 주세요</label>
      <input type="text" id="nm" autocomplete="name" maxlength="20" value="${esc(uname)}" placeholder="예: 김지우">
      <p class="hint">결과 화면에 이름이 함께 나옵니다. 그 화면을 캡처해서 제출하게 됩니다.</p>
      <p class="warn" id="wn">이름을 적어야 시작할 수 있습니다.</p>
      <div class="row"><button class="go" id="startBtn">시작하기</button></div>
    </div>`;
  const input = document.getElementById("nm");
  const warn = document.getElementById("wn");
  const start = () => {
    const v = input.value.trim();
    if (!v){ warn.classList.add("show"); input.focus(); return; }
    uname = v; step = 0; render();
  };
  document.getElementById("startBtn").onclick = start;
  input.addEventListener("keydown", e => { if (e.key === "Enter") start(); });
  input.addEventListener("input", () => warn.classList.remove("show"));
  input.focus();
}

function renderQuestion(){
  const q = Q[step];
  const ticks = Q.map((_, i) =>
    `<i class="${i < step ? "on" : (i === step ? "now" : "")}"></i>`).join("");
  const quotes = q.quotes.length
    ? `<div class="quotes">${q.quotes.map(([tag, t]) =>
        `<p>${tag ? `<b>${tag}</b>` : ""}${esc(t)}</p>`).join("")}</div>`
    : "";
  const opts = q.opts.map(([label, val], i) =>
    `<button class="opt" data-v="${val}" aria-pressed="${picks[step] === val}">${esc(label)}</button>`
  ).join("");

  stage.innerHTML = `
    <div class="screen">
      <div class="ticks">${ticks}</div>
      <div class="count">${step + 1} / ${Q.length}</div>
      <p class="setup">${esc(q.setup)}</p>
      ${quotes}
      <p class="ask">${esc(q.ask)}</p>
      <div class="opts">${opts}</div>
      <div class="row"><button class="back" id="backBtn">이전</button></div>
    </div>`;

  stage.querySelectorAll("button.opt").forEach(b => {
    b.onclick = () => {
      picks[step] = b.dataset.v;
      step++;
      render();
      window.scrollTo(0, 0);
    };
  });
  document.getElementById("backBtn").onclick = () => {
    step--; render(); window.scrollTo(0, 0);
  };
}

function renderResult(){
  const tally = {};
  picks.forEach(v => { if (v) tally[v] = (tally[v] || 0) + 1; });
  const code = AXES.map(a =>
    (tally[a.pair[0]] || 0) >= (tally[a.pair[1]] || 0) ? a.pair[0] : a.pair[1]
  ).join("");
  const [tname, tsub, tdesc] = TYPES[code];

  const rows = AXES.map((a, i) => {
    const letter = code[i];
    return `<div class="axis">
      <div class="k">${a.key}</div>
      <div class="pick">${NEAR[letter].pick}</div>
      <div class="near">${NEAR[letter].near}</div>
    </div>`;
  }).join("");

  stage.innerHTML = `
    <div class="screen">
      <div class="card">
        <div class="who">응시자</div>
        <p class="name">${esc(uname)}</p>
        <p class="code">${code}</p>
        <p class="tname">${tname}</p>
        <p class="tsub">${tsub}</p>
        <p class="tdesc">${tdesc}</p>
      </div>

      <div class="card">${rows}</div>

      <div class="closing">
        <p><strong>물론, 어느 쪽도 틀린 시선이 아닙니다.</strong></p>
        <p>여기 나온 갈림길은 전부 100년 동안 학자들이 실제로 나뉘어 온 지점이니까요. 정답이 정해져 있었다면 애초에 갈리지도 않았겠죠.</p>
      </div>

      <div class="shot">이름이 보이도록 이 화면을 캡처해 구글 폼으로 제출해 주세요.</div>

      <div class="row">
        <button class="back" id="againBtn">다시 하기</button>
      </div>
    </div>`;

  document.getElementById("againBtn").onclick = () => {
    picks.fill(null); step = -1; render(); window.scrollTo(0, 0);
  };
  window.scrollTo(0, 0);
}

render();
</script>
</body>
</html>
